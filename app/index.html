<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Claude 会话看板</title>
<style>
  /* 字体各平台取各自的系统 UI 字体，别硬指定某一款 —— Mac 上没有微软雅黑 */
  :root {
    --line: #ececec;
    --muted: #8a8a8a;
    --hover: #f0f4f8;
    --sel: #d6e8f7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei UI", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
    font-size: 13px; color: #222; background: #fff;
    user-select: none;
  }
  body { display: flex; flex-direction: column; }

  .bar { padding: 8px 10px 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .bar label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .bar select, .bar button { font: inherit; padding: 3px 8px; }
  .bar button { cursor: pointer; }
  .stat { color: var(--muted); margin-left: auto; }
  .health { padding: 4px 10px 8px; color: var(--muted); font-size: 12px; }
  .health.warn { color: #b8860b; }
  .health.bad { color: #b22222; }

  .wrap { flex: 1; overflow: auto; margin: 0 10px; border: 1px solid #ddd; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: #f7f7f7; border-bottom: 1px solid #ddd;
    padding: 6px 8px; text-align: left; font-weight: 600;
  }
  tbody td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; }
  tbody tr:hover { background: var(--hover) !important; }
  tbody tr.sel { background: var(--sel) !important; }
  /* 颜色信号集中在状态列的文字上，行底色只做极淡的暗示 ——
     整行铺饱和底色会让信号强度和覆盖面积不匹配，看着刺眼 */
  td.status { font-weight: 600; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  .detail { border-top: 1px solid #ddd; padding: 6px 10px 10px; }
  .detail .hint { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .detail pre {
    margin: 0; height: 92px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    background: #fafafa; border: 1px solid #e5e5e5; padding: 6px; font: inherit;
    user-select: text;
  }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<div class="bar">
  <label><input type="checkbox" id="cbTop"> 置顶</label>
  <label><input type="checkbox" id="cbSound" checked> 响铃</label>
  <label><input type="checkbox" id="cbNotify" checked> 通知</label>
  <label><input type="checkbox" id="cbFolded"> <span id="foldedLbl">显示全部</span></label>
  <label><input type="checkbox" id="cbAuto"> 开机自启</label>
  <span>排序
    <select id="selSort">
      <option value="0">需求度（谁最需要你）</option>
      <option value="1">启动顺序</option>
      <option value="2">最近活动</option>
      <option value="3">项目名</option>
    </select>
  </span>
  <button id="btnClear" title="把这三类隐藏起来，不删数据；它们下次有动静会自己回来">隐藏已完成/久候/已关闭</button>
  <button id="btnHelp">?</button>
  <span class="stat" id="stat"></span>
</div>
<div class="health" id="health"></div>

<div class="wrap">
  <table>
    <thead><tr>
      <th style="width:110px">状态</th>
      <th style="width:230px">会话标题</th>
      <th style="width:250px">项目 / worktree</th>
      <th style="width:90px" class="num">等你多久</th>
      <th style="width:90px" class="num">本轮用时</th>
      <th style="width:80px" class="num">静默</th>
      <th style="width:90px" class="num">整体耗时</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">暂无会话</div>
</div>

<div class="detail">
  <div class="hint">选中会话的最近一轮对话（双击 = 打开目录；右键 = 菜单；Delete = 隐藏这一条；Esc = 取消选择）：</div>
  <pre id="detail"></pre>
</div>

<script>
const tb = document.getElementById('tb')
const detail = document.getElementById('detail')
let selected = null          // 当前选中的 sessionId
let rowsById = new Map()     // sessionId -> 行数据
let trById = new Map()       // sessionId -> <tr>，用于增量更新，避免整表重建

const COLS = ['statusText', 'title', 'label', 'waitText', 'durText', 'silentText', 'lifeText']

function renderRows(rows) {
  const want = new Set(rows.map(r => r.sessionId))

  // 删掉已经不在的行
  for (const [id, tr] of trById) {
    if (!want.has(id)) { tr.remove(); trById.delete(id) }
  }

  rows.forEach((r, idx) => {
    let tr = trById.get(r.sessionId)
    if (!tr) {
      tr = document.createElement('tr')
      tr.dataset.id = r.sessionId
      for (let c = 0; c < COLS.length; c++) {
        const td = document.createElement('td')
        if (c === 0) td.className = 'status'
        if (c >= 3) td.className = 'num'
        tr.appendChild(td)
      }
      trById.set(r.sessionId, tr)
    }
    // 只写变化的单元格。DOM 更新本来就是合成的，不会像 WinForms 那样整片重绘，
    // 但没必要做无谓的写入。
    for (let c = 0; c < COLS.length; c++) {
      const v = String(r[COLS[c]] == null ? '' : r[COLS[c]])
      const td = tr.children[c]
      if (td.textContent !== v) td.textContent = v
      if (c === 0 && td.style.color !== r.accent) td.style.color = r.accent
    }
    if (tr.style.background !== r.back) tr.style.background = r.back
    const fore = (r.eff === 'idle' || r.eff === 'closed' || r.eff === 'fresh' || r.eff === 'stalled' || r.eff === 'hidden') ? r.fore : ''
    if (tr.style.color !== fore) tr.style.color = fore
    tr.classList.toggle('sel', r.sessionId === selected)

    // 顺序就位：只有位置不对的才搬，不重建
    const at = tb.children[idx]
    if (at !== tr) tb.insertBefore(tr, at || null)
  })

  rowsById = new Map(rows.map(r => [r.sessionId, r]))
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block'
  if (selected && !rowsById.has(selected)) { selected = null; detail.textContent = '' }
}

async function showDetail(id) {
  const r = rowsById.get(id)
  if (!r) return
  const ex = await window.board.getExchange(r.sessionId, r.transcript)
  // 「你」这一侧优先用 hook 抓的 last_prompt —— 那才是真正敲进去的原文。
  // transcript 里的 user 消息会混进 SKILL.md 正文、IDE 上下文等注入内容。
  const you = r.lastPrompt || ex.user || '（无）'
  const it = ex.assistant || '（无）'
  detail.textContent = '你：' + you + '\n\n它：' + it
}

tb.addEventListener('click', (e) => {
  const tr = e.target.closest('tr')
  if (!tr) return
  selected = tr.dataset.id
  for (const t of trById.values()) t.classList.toggle('sel', t === tr)
  showDetail(selected)
})
tb.addEventListener('dblclick', (e) => {
  const tr = e.target.closest('tr')
  if (!tr) return
  const r = rowsById.get(tr.dataset.id)
  if (r) window.board.openFolder(r.cwd)
})
// 点空白处取消选择
document.querySelector('.wrap').addEventListener('mousedown', (e) => {
  if (!e.target.closest('tr')) {
    selected = null
    for (const t of trById.values()) t.classList.remove('sel')
    detail.textContent = ''
  }
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    selected = null
    for (const t of trById.values()) t.classList.remove('sel')
    detail.textContent = ''
  } else if (e.key === 'Delete' && selected) {
    // 已隐藏的行只在「显示全部」时才看得到，此时 Delete 当取消隐藏用 —— 同一个键来回切
    const r = rowsById.get(selected)
    if (r && r.hidden) { window.board.unhideRecord(selected); return }
    window.board.removeRecord(selected)
    selected = null
    detail.textContent = ''
  }
})
tb.addEventListener('contextmenu', (e) => {
  e.preventDefault()
  const tr = e.target.closest('tr')
  if (!tr) return
  const r = rowsById.get(tr.dataset.id)
  if (!r) return
  selected = r.sessionId
  for (const t of trById.values()) t.classList.toggle('sel', t === tr)
  showDetail(selected)
  // 交给主进程弹原生菜单：Electron 禁用了 window.prompt()，
  // 在页面里自己造菜单也不如原生的顺手（键盘导航、Mac 上的外观）。
  // hidden 必须带上 —— 主进程靠它决定菜单第一项是「隐藏」还是「取消隐藏」。
  // 漏了它的话 row.hidden 恒为 undefined，永远只显示「隐藏」。
  window.board.showContextMenu({ sessionId: r.sessionId, cwd: r.cwd, label: r.label, hidden: !!r.hidden })
})

// ---- 顶部控件 ----
const bind = (id, key, prop) => {
  const el = document.getElementById(id)
  el.addEventListener('change', () => window.board.setSetting(key, prop === 'value' ? Number(el.value) : el.checked))
  return el
}
const cbTop = bind('cbTop', 'alwaysOnTop')
const cbSound = bind('cbSound', 'sound')
const cbNotify = bind('cbNotify', 'notify')
const cbFolded = bind('cbFolded', 'showFolded')
const cbAuto = bind('cbAuto', 'autoLaunch')
const selSort = bind('selSort', 'sort', 'value')

document.getElementById('btnClear').addEventListener('click', () => window.board.clearStale())
document.getElementById('btnHelp').addEventListener('click', () => {
  alert(
`【状态】按"有多需要你"分档
  ？在问你   卡在 AskUserQuestion 等你作答，不理它就永远不会继续
  ▲ 等你输入 空闲等待你的输入
  ✔ 已完成   这一轮跑完了，球在你手上
  ● 运行中   正在干活，不用管
  ○ 空闲     会话开着但还没交互过
  … 失联？   心跳静默超过 5 分钟（仅注册表降级时出现）
  · 久候     超过 2 小时没被处理，默认不显示
  ✕ 已关闭   进程已退出（按 pid 精确判定），默认不显示
  · 已隐藏   你手动隐藏的，默认不显示；它下次有动静会自己回来

【排序】
  需求度   上面的顺序，同档按冷落最久优先
  启动顺序 按会话启动先后固定排列，位置不跳
  最近活动 刚有动静的排前面
  项目名   按 项目/worktree 字母序
  非「需求度」排法下，久候 / 已关闭 / 已隐藏一律沉底

【操作】
  双击行  在文件管理器打开该会话的工作目录
  右键    菜单（隐藏 or 取消隐藏 / 复制路径 / 打开目录）
  Delete  隐藏这一条（不等于关会话；勾「显示全部」可找回，
          该会话下次有动静会自己回到列表）；在已隐藏的行上按 = 取消隐藏
  Esc     取消选择

【数据来源】
  会话清单 / 死活 / 忙闲  ← Claude Code 的活会话注册表 ~/.claude/sessions/<pid>.json
  等你多久 / 本轮用时 / 摘要 / 标题 ← 本看板的 hook 记录
  心跳                    ← 该会话 transcript 文件的修改时间`)
})

// ---- 数据推送 ----
let settingsApplied = false
window.board.onRows(({ rows, stats, settings }) => {
  if (!settingsApplied) {
    cbTop.checked = !!settings.alwaysOnTop
    cbSound.checked = !!settings.sound
    cbNotify.checked = !!settings.notify
    cbFolded.checked = !!settings.showFolded
    cbAuto.checked = !!settings.autoLaunch
    selSort.value = String(settings.sort || 0)
    settingsApplied = true
  }

  renderRows(rows)

  let s = '活 ' + stats.live + ' · 待处理 ' + stats.needYou
  if (stats.folded > 0) s += ' · 已隐藏 ' + stats.folded
  document.getElementById('stat').textContent = s
  document.getElementById('foldedLbl').textContent =
    stats.folded > 0 ? ('显示全部 (' + stats.folded + ')') : '显示全部'

  const h = document.getElementById('health')
  if (stats.health && stats.health.length) {
    h.className = 'health bad'
    h.textContent = 'hook 链路异常：' + stats.health.join(' / ') + '  → 重启看板会重新提示安装'
  } else if (!stats.regUsable) {
    h.className = 'health warn'
    h.textContent = 'hook 链路正常（4 个事件已注册） · 会话注册表不可用，已降级为 hook 推导（不再判定"已关闭"）'
  } else {
    h.className = 'health'
    h.textContent = 'hook 链路正常（4 个事件已注册） · 会话注册表可用，死活与忙闲以它为准'
      + (stats.closed > 0 ? ('；已确认关闭 ' + stats.closed + ' 条（可点上方隐藏）') : '')
  }
})

window.board.onError((msg) => {
  const h = document.getElementById('health')
  h.className = 'health bad'
  h.textContent = '刷新出错：' + msg
})
</script>
</body>
</html>
